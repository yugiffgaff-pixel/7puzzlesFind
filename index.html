<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>七巧板</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23b6402c'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='20' fill='%23fffaf3' font-family='serif'%3E七%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header>
      <div class="seal" aria-hidden="true">七</div>
      <div>
        <h1>七巧板</h1>
        <p>给出一块轮廓。程序在上面切开，并按顺序告诉你七块怎么放。</p>
      </div>
    </header>
    <main>
      <section class="stage">
        <div class="modes" role="tablist">
          <button type="button" id="tab-classic" role="tab" aria-selected="true">经典图形</button>
          <button type="button" id="tab-draw" role="tab" aria-selected="false">点顶点</button>
          <button type="button" id="tab-upload" role="tab" aria-selected="false">上传剪影</button>
        </div>
        <div id="figure-bar" class="figure-bar"></div>
        <div class="canvas-wrap" id="wrap">
          <canvas id="board" aria-label="七巧板画板"></canvas>
          <p id="meter"></p>
        </div>
        <p id="hint" class="hint"></p>
        <div class="toolbar" id="toolbar"></div>
      </section>
      <aside class="panel">
        <h2>拼法</h2>
        <p id="status" aria-live="polite"></p>
        <div id="progress" hidden></div>
        <ol id="steps"></ol>
        <div class="step-actions" id="step-actions"></div>
        <div class="legend" id="legend"></div>
        <p class="note">七块都要用上，不能重叠，也不能留缝。平行四边形可以翻面。计算在这台设备上完成，图片不会离开浏览器。</p>
      </aside>
    </main>
    <input id="file" type="file" accept="image/*" hidden />
    <script src="js/grid.js"></script>
    <script src="js/pieces.js"></script>
    <script src="js/solver.js"></script>
    <script src="js/analyze.js"></script>
    <script src="js/image.js"></script>
    <script src="js/figures.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
